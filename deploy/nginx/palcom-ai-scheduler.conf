# ==============================================================================
# Nginx Configuration for PALCOM AI Scheduler (Production)
# Laravel 13 / PHP 8.3-FPM / Livewire 4 / Flux UI
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name palcomaischeduler.web.id;

    # PERHATIAN: Setelah 'certbot --nginx' dijalankan, Certbot akan menyisipkan
    # blok SSL (port 443 dan sertifikat). Jangan menimpa file ini secara utuh
    # setelah sertifikat SSL aktif di /etc/nginx/sites-available/.
    # Redirect HTTP ke HTTPS akan dikelola otomatis oleh Certbot.

    root /var/www/PalcomAIScheduler/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # Max upload size
    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Logging
    access_log /var/log/nginx/palcom_scheduler_access.log;
    error_log /var/log/nginx/palcom_scheduler_error.log error;

    # Static Assets Caching (Vite build output: public/build)
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and Robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI processing
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Livewire Long-Polling & SSE buffer settings
        fastcgi_buffering off;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sqlite databases and storage raw files
    location ~* \.(sqlite|sqlite3|db)$ {
        deny all;
        return 404;
    }
}
